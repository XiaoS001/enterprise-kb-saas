{% extends "base.html" %}
{% block title %}企业后台{% endblock %}
{% block page_title %}企业后台{% endblock %}
{% block page_sub %}套餐、额度与成员{% endblock %}

{% block head %}
<style>
  .me-row{background:#fbfcff}
  .role-cell{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .role-cell select{width:118px}
  .plan-box{display:flex; align-items:baseline; gap:8px}
  .plan-box .plan{font-size:17px; font-weight:600}
  .quota-line{display:flex; align-items:center; gap:10px; margin-top:10px;
    font-size:12.5px; color:var(--muted)}
  .quota-line .bar{flex:1}
  .member-name{white-space:nowrap}
  @media (max-width:640px){
    /* 手机上「加入时间」不是关键信息，让位给角色和操作 */
    .members-table th:nth-child(3),.members-table td:nth-child(3){display:none}
    .role-cell select{width:100px; font-size:12px}
    .role-cell .muted{display:none}
    .member-name{font-size:13px}
  }
</style>
{% endblock %}

{% block body %}
<div class="grid kpi" id="kpis" style="margin-bottom:14px"></div>

<div class="card">
  <div class="card-head">
    <div>
      <h2>成员</h2>
      <div class="sub" id="member-sub">加载中…</div>
    </div>
    <div class="row">
      <a class="btn" href="/org/usage">用量明细</a>
      <button class="btn primary" id="btn-add">添加成员</button>
    </div>
  </div>
  <div id="msg"></div>
  <div id="members"></div>
</div>
{% endblock %}

{% block script %}
<script>
(async () => {
  const me = await renderChrome('/org');
  if (!me) { location.href = '/login'; return; }
  await loadQuotaChip();

  // /api/auth/me 里没有 id，判断「哪一行是我」要用 profile
  const profileRes = await API.get('/api/auth/profile');
  const myId = profileRes.ok ? profileRes.data.id : null;

  const msg = document.getElementById('msg');
  const memberBox = document.getElementById('members');
  const addBtn = document.getElementById('btn-add');
  const kpiBox = document.getElementById('kpis');

  const ROLE_OPTIONS = [
    ['org_admin', '企业管理员'],
    ['member', '成员'],
    ['viewer', '只读'],
  ];

  function renderKpis(billing) {
    if (!billing) { kpiBox.replaceChildren(); return; }
    const quota = billing.quota || {};
    const usage = billing.usage || {};
    const ratio = pct(quota.quota_used || 0, quota.quota_total || 0);

    kpiBox.replaceChildren(
      el('div', { class: 'kpi' },
        el('div', { class: 'plan-box' },
          el('span', { class: 'plan', text: billing.plan_name || '—' }),
          quota.exhausted ? el('span', { class: 'tag bad', text: '额度已用完' }) : null),
        el('div', { class: 'lbl', text: '当前套餐' }),
        el('div', { class: 'quota-line' },
          el('span', { text: `${fmtNum(quota.quota_used || 0)} / ${fmtNum(quota.quota_total || 0)}` }),
          el('div', { class: 'bar' + (quota.exhausted ? ' bad' : (ratio >= 80 ? ' warn' : '')) },
            el('i', { style: `width:${Math.min(100, ratio)}%` })))),
      el('div', { class: 'kpi' },
        el('div', { class: 'num', text: fmtNum(billing.member_count || 0) }),
        el('div', { class: 'lbl', text: '成员' }),
        el('div', { class: 'hint', text: '本租户' })),
      el('div', { class: 'kpi' },
        el('div', { class: 'num', text: fmtNum(billing.kb_count || 0) }),
        el('div', { class: 'lbl', text: '知识库' }),
        el('div', { class: 'hint', text: '同租户可见' })),
      el('div', { class: 'kpi' },
        el('div', { class: 'num', text: fmtNum(usage.total_queries || 0) }),
        el('div', { class: 'lbl', text: '累计提问' }),
        el('div', { class: 'hint', text: usage.degraded_queries
          ? `其中降级 ${fmtNum(usage.degraded_queries)} 次`
          : '没有降级回答' })));
  }

  async function changeRole(user, select) {
    const previous = user.role;
    select.disabled = true;
    const r = await API.put('/api/org/members/' + user.id + '/role', { role: select.value });
    select.disabled = false;
    if (!r.ok) {
      select.value = previous;
      showMsg(msg, 'bad', r.data.error || '角色修改失败');
      return;
    }
    showMsg(msg, 'ok', `${user.username} 的角色已改为 ${ROLE_LABELS[r.data.role] || r.data.role}`);
    load();
  }

  async function removeMember(user) {
    const ok = await confirmAction(
      '移除成员',
      `「${user.username}」将立刻失去本租户的访问权限，账号本身不会被删除。`,
      '确认移除');
    if (!ok) return;

    const r = await API.del('/api/org/members/' + user.id);
    if (!r.ok) { showMsg(msg, 'bad', r.data.error || '移除失败'); return; }
    showMsg(msg, 'ok', `已移除 ${user.username}`);
    load();
  }

  function renderMembers(members) {
    document.getElementById('member-sub').textContent =
      `${members.length} 人 · 角色决定能做什么，不只是好看`;

    if (!members.length) {
      memberBox.replaceChildren(emptyState('还没有成员', '添加第一个成员。'));
      return;
    }

    const tbody = el('tbody');
    for (const user of members) {
      const isSelf = myId !== null && user.id === myId;
      const isPlatform = user.role === 'platform_admin';

      const select = el('select', {
        class: 'select',
        disabled: isSelf || isPlatform,
        onchange: () => changeRole(user, select),
      }, ROLE_OPTIONS.map(([value, label]) =>
        el('option', { value, text: label, selected: value === user.role ? '' : null })));

      const actions = el('div', { class: 'row' },
        // 平台管理员的角色不归租户管，连按钮都不给
        isPlatform || isSelf ? el('span', { class: 'muted',
          style: 'font-size:12px',
          text: isSelf ? '这是你自己' : '平台账号' })
          : el('button', { class: 'btn sm danger', onclick: () => removeMember(user) }, '移除'));

      tbody.append(el('tr', { class: isSelf ? 'me-row' : null },
        el('td', {},
          el('div', { class: 'row' },
            el('span', { class: 'avatar', text: (user.username || '?').slice(0, 1).toUpperCase() }),
            el('b', { class: 'member-name', text: user.username }),
            isSelf ? el('span', { class: 'tag brand', text: '我' }) : null)),
        el('td', {}, el('div', { class: 'role-cell' }, select,
          el('span', { class: 'muted', style: 'font-size:11.5px',
            text: isPlatform ? '平台账号，跨租户' : '' }))),
        el('td', { class: 'muted nowrap' }, fmtTime(user.created_at)),
        el('td', {}, actions)));
    }

    memberBox.replaceChildren(el('div', { class: 'table-wrap' },
      el('table', { class: 'table members-table' },
        el('thead', {}, el('tr', {},
          el('th', { text: '成员' }),
          el('th', { text: '角色' }),
          el('th', { text: '加入时间' }),
          el('th', { text: '操作' }))),
        tbody)));
  }

  function openAdd() {
    const nameInput = el('input', { class: 'input', placeholder: '登录用户名，至少 3 位' });
    const passInput = el('input', { class: 'input', type: 'password',
      placeholder: '初始密码，至少 6 位' });
    const roleSelect = el('select', { class: 'select' },
      el('option', { value: 'member', text: '成员 —— 提问 + 看历史' }),
      el('option', { value: 'viewer', text: '只读 —— 只能看历史' }));
    const hint = el('div', { class: 'msg' });

    const submit = el('button', {
      class: 'btn primary',
      onclick: async () => {
        submit.disabled = true;
        const r = await API.post('/api/org/members', {
          username: nameInput.value.trim(),
          password: passInput.value,
          role: roleSelect.value,
        });
        submit.disabled = false;
        if (!r.ok) { showMsg(hint, 'bad', r.data.error || '添加失败'); return; }
        closeDrawer();
        toast(`已添加 ${r.data.username}`, 'ok');
        load();
      },
    }, '添加');

    openDrawer('添加成员', '只能加到本租户，角色限成员 / 只读', [
      hint,
      el('div', { class: 'field' }, el('label', { text: '用户名' }), nameInput),
      el('div', { class: 'field' }, el('label', { text: '初始密码' }), passInput),
      el('div', { class: 'field' }, el('label', { text: '角色' }), roleSelect),
      el('div', { class: 'row', style: 'justify-content:flex-end' }, submit),
    ]);
    setTimeout(() => nameInput.focus(), 50);
  }

  async function load() {
    const [billingRes, membersRes] = await Promise.all([
      API.get('/api/org/billing'),
      API.get('/api/org/members'),
    ]);

    renderKpis(billingRes.ok ? billingRes.data : null);

    if (!membersRes.ok) {
      showMsg(msg, 'bad', membersRes.data.error || '成员加载失败');
      memberBox.replaceChildren();
      return;
    }
    renderMembers(membersRes.data || []);
  }

  addBtn.addEventListener('click', openAdd);
  load();
})();
</script>
{% endblock %}
