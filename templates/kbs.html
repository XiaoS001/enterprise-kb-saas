{% extends "base.html" %}
{% block title %}知识库{% endblock %}
{% block page_title %}知识库{% endblock %}
{% block page_sub %}上传文档，提问带出处{% endblock %}

{% block head %}
<style>
  .kb-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px}
  .kb-item{
    border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px;
    background:#fff; display:flex; flex-direction:column; gap:9px;
    transition:border-color .15s, box-shadow .15s; min-width:0;
  }
  .kb-item:hover{border-color:#c3d3f5; box-shadow:0 6px 18px -14px rgba(16,24,40,.5)}
  .kb-item .name{
    font-size:14.5px; font-weight:600; color:var(--text); display:flex;
    align-items:center; gap:7px; min-width:0;
  }
  .kb-item .name a{color:inherit; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap}
  .kb-item .desc{font-size:12.5px; color:var(--muted); line-height:1.6;
    min-height:20px; word-break:break-word}
  .kb-item .foot{display:flex; align-items:center; justify-content:space-between;
    gap:8px; margin-top:auto; padding-top:4px; flex-wrap:wrap}
  @media (max-width:760px){ .kb-grid{grid-template-columns:1fr} }</style>
{% endblock %}

{% block body %}
<div class="grid kpi" style="margin-bottom:14px">
  <div class="kpi">
    <div class="num" id="kpi-kb">—</div>
    <div class="lbl">知识库</div>
    <div class="hint" id="kpi-kb-hint">—</div>
  </div>
  <div class="kpi">
    <div class="num" id="kpi-docs">—</div>
    <div class="lbl">文档分段</div>
    <div class="hint">上传后自动切段</div>
  </div>
  <div class="kpi">
    <div class="num" id="kpi-queries">—</div>
    <div class="lbl">累计提问</div>
    <div class="hint" id="kpi-degraded">—</div>
  </div>
  <div class="kpi">
    <div class="num" id="kpi-quota">—</div>
    <div class="lbl">额度使用</div>
    <div class="bar" style="margin-top:9px"><i id="bar-quota" style="width:0"></i></div>
  </div>
</div>

<div class="card">
  <div class="card-head">
    <div>
      <h2>全部知识库</h2>
      <div class="sub" id="kb-sub">加载中…</div>
    </div>
    <div class="row">
      <input class="input" id="kb-filter" placeholder="按名称筛选"
             style="width:170px" autocomplete="off">
      <button class="btn primary" id="btn-new-kb">新建知识库</button>
    </div>
  </div>

  <div id="msg"></div>
  <div id="kb-list"></div>
</div>
{% endblock %}

{% block script %}
<script>
(async () => {
  const me = await renderChrome('/kbs');
  if (!me) { location.href = '/login'; return; }
  await loadQuotaChip();

  const canManage = (me.permissions || []).includes('manage_kb');
  const msg = document.getElementById('msg');
  const listBox = document.getElementById('kb-list');
  const filterInput = document.getElementById('kb-filter');
  const newBtn = document.getElementById('btn-new-kb');

  if (!canManage) newBtn.classList.add('hidden');

  let kbs = [];

  function renderKpis(data) {
    document.getElementById('kpi-kb').textContent = fmtNum(data.kbs.length);
    const docs = data.kbs.reduce((sum, kb) => sum + (kb.document_count || 0), 0);
    document.getElementById('kpi-docs').textContent = fmtNum(docs);
    document.getElementById('kpi-kb-hint').textContent =
      data.kbs.length ? '最近更新 ' + fmtTime(data.latest) : '还没有知识库';

    const usage = data.billing && data.billing.usage ? data.billing.usage : null;
    document.getElementById('kpi-queries').textContent =
      usage ? fmtNum(usage.total_queries) : '—';
    document.getElementById('kpi-degraded').textContent = usage
      ? (usage.degraded_queries
          ? '其中降级 ' + fmtNum(usage.degraded_queries) + ' 次（不计费）'
          : '没有降级回答')
      : '—';

    const quota = data.billing ? data.billing.quota : null;
    if (!quota) {
      document.getElementById('kpi-quota').textContent = '—';
    } else {
      document.getElementById('kpi-quota').textContent =
        fmtNum(quota.quota_used) + ' / ' + fmtNum(quota.quota_total);
      const bar = document.getElementById('bar-quota');
      const ratio = pct(quota.quota_used, quota.quota_total);
      bar.style.width = Math.min(100, ratio) + '%';
      bar.parentElement.className = 'bar' + (quota.exhausted ? ' bad' : (ratio >= 80 ? ' warn' : ''));
    }

    document.getElementById('kb-sub').textContent = data.kbs.length
      ? data.kbs.length + ' 个知识库 · ' + fmtNum(docs) + ' 段文档'
      : '还没有知识库';
  }

  function renderEmpty() {
    if (me.role === 'platform_admin') {
      listBox.replaceChildren(emptyState(
        '平台管理员不属于任何租户',
        '知识库按租户隔离，平台视角请看「平台后台」里每个租户的库。',
        el('a', { class: 'btn', href: '/platform', text: '去平台后台' })));
      return;
    }
    listBox.replaceChildren(emptyState(
      '还没有知识库',
      canManage ? '新建一个，然后上传第一份文档。' : '请联系企业管理员创建。',
      canManage ? el('button', {
        class: 'btn primary',
        onclick: () => openCreate(),
      }, '新建知识库') : null));
  }

  function renderList() {
    const keyword = filterInput.value.trim().toLowerCase();
    const items = keyword
      ? kbs.filter(kb => (kb.name || '').toLowerCase().includes(keyword))
      : kbs;

    if (!kbs.length) { renderEmpty(); return; }

    if (!items.length) {
      listBox.replaceChildren(emptyState('没有匹配的知识库',
        '换个关键词试试，或者清空筛选。'));
      return;
    }

    const grid = el('div', { class: 'kb-grid' });
    for (const kb of items) {
      const actions = el('div', { class: 'row' },
        el('a', { class: 'btn sm', href: '/kbs/' + kb.id, text: '打开' }),
        el('a', { class: 'btn sm', href: '/kbs/' + kb.id + '/ask', text: '问答' }));
      if (canManage) {
        actions.append(el('button', {
          class: 'btn sm danger',
          onclick: async () => {
            const ok = await confirmAction(
              '删除知识库',
              `「${kb.name}」里的 ${fmtNum(kb.document_count)} 段文档会一起删掉，且不能恢复。`,
              '确认删除');
            if (!ok) return;
            const r = await API.del('/api/kbs/' + kb.id);
            if (!r.ok) { showMsg(msg, 'bad', r.data.error || '删除失败'); return; }
            showMsg(msg, 'ok', `已删除「${kb.name}」`);
            load();
          },
        }, '删除'));
      }

      grid.append(el('div', { class: 'kb-item' },
        el('div', { class: 'name' },
          el('a', { href: '/kbs/' + kb.id, text: kb.name || '未命名' }),
          kb.document_count === 0 ? el('span', { class: 'tag warn', text: '空库' }) : null),
        el('div', { class: 'desc', text: kb.description || '没有描述' }),
        el('div', { class: 'foot' },
          el('div', { class: 'chips' },
            el('span', { class: 'tag', text: fmtNum(kb.document_count) + ' 段文档' }),
            el('span', { class: 'tag', text: fmtTime(kb.created_at) })),
          actions)));
    }
    listBox.replaceChildren(grid);
  }

  function openCreate() {
    const nameInput = el('input', { class: 'input', placeholder: '例如：运维知识库' });
    const descInput = el('input', { class: 'input', placeholder: '一句话说明这个库存什么（可不填）' });
    const hint = el('div', { class: 'msg' });

    const submit = el('button', {
      class: 'btn primary',
      onclick: async () => {
        const name = nameInput.value.trim();
        if (!name) { showMsg(hint, 'bad', '请填写知识库名称'); nameInput.focus(); return; }
        submit.disabled = true;
        const r = await API.post('/api/kbs', { name, description: descInput.value.trim() });
        submit.disabled = false;
        if (!r.ok) { showMsg(hint, 'bad', r.data.error || '创建失败'); return; }
        closeDrawer();
        toast('已创建「' + r.data.name + '」', 'ok');
        load();
      },
    }, '创建');

    openDrawer('新建知识库', '创建后即可上传文档', [
      hint,
      el('div', { class: 'field' }, el('label', { text: '名称' }), nameInput),
      el('div', { class: 'field' }, el('label', { text: '描述' }), descInput),
      el('div', { class: 'row', style: 'justify-content:flex-end' }, submit),
    ]);
    setTimeout(() => nameInput.focus(), 50);
  }

  async function load() {
    const [kbsRes, billingRes] = await Promise.all([
      API.get('/api/kbs'),
      API.get('/api/org/billing'),
    ]);

    if (!kbsRes.ok) {
      showMsg(msg, 'bad', kbsRes.data.error || '知识库加载失败');
      listBox.replaceChildren();
      return;
    }
    clearMsg(msg);

    kbs = kbsRes.data || [];
    const latest = kbs.map(kb => kb.created_at).filter(Boolean).sort().pop() || null;
    renderKpis({ kbs, billing: billingRes.ok ? billingRes.data : null, latest });
    renderList();
  }

  newBtn.addEventListener('click', openCreate);
  filterInput.addEventListener('input', renderList);
  load();
})();
</script>
{% endblock %}
