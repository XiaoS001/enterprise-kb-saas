{% extends "base.html" %}
{% block title %}平台后台{% endblock %}
{% block page_title %}平台后台{% endblock %}
{% block page_sub %}跨租户总览{% endblock %}

{% block head %}
<style>
  .tenant-name{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .tenant-name b{font-weight:600}
  .mini-bar{width:110px; height:6px; border-radius:99px; background:var(--line-2);
    overflow:hidden; display:inline-block; vertical-align:middle}
  .mini-bar i{display:block; height:100%; background:var(--brand); border-radius:99px}
  .mini-bar.warn i{background:var(--warn)}
  .mini-bar.bad i{background:var(--bad)}
  .muted-mono{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
    color:var(--faint)}
</style>
{% endblock %}

{% block body %}
<div class="grid kpi" id="kpis" style="margin-bottom:14px"></div>

<div class="card">
  <div class="card-head">
    <div>
      <h2>租户</h2>
      <div class="sub" id="tenant-sub">加载中…</div>
    </div>
    <div class="row">
      <input class="input" id="filter" placeholder="按租户名筛选"
             style="width:170px" autocomplete="off">
    </div>
  </div>
  <div id="msg"></div>
  <div id="tenants"></div>
</div>
{% endblock %}

{% block script %}
<script>
(async () => {
  const me = await renderChrome('/platform');
  if (!me) { location.href = '/login'; return; }
  await loadQuotaChip();

  const msg = document.getElementById('msg');
  const box = document.getElementById('tenants');
  const filter = document.getElementById('filter');

  let tenants = [];
  let planNames = {};

  function renderKpis() {
    const members = tenants.reduce((sum, t) => sum + (t.member_count || 0), 0);
    const kbs = tenants.reduce((sum, t) => sum + (t.kb_count || 0), 0);
    const used = tenants.reduce((sum, t) => sum + (t.quota_used || 0), 0);

    document.getElementById('kpis').replaceChildren(
      el('div', { class: 'kpi' },
        el('div', { class: 'num', text: fmtNum(tenants.length) }),
        el('div', { class: 'lbl', text: '租户' }),
        el('div', { class: 'hint', text: '每一行数据都按 tenant_id 隔离' })),
      el('div', { class: 'kpi' },
        el('div', { class: 'num', text: fmtNum(members) }),
        el('div', { class: 'lbl', text: '账号总数' }),
        el('div', { class: 'hint', text: '含各角色' })),
      el('div', { class: 'kpi' },
        el('div', { class: 'num', text: fmtNum(kbs) }),
        el('div', { class: 'lbl', text: '知识库' }),
        el('div', { class: 'hint', text: '跨全部租户' })),
      el('div', { class: 'kpi' },
        el('div', { class: 'num', text: fmtNum(used) }),
        el('div', { class: 'lbl', text: '已消耗额度' }),
        el('div', { class: 'hint', text: '计费问答次数合计' })));
  }

  function renderTable() {
    const keyword = filter.value.trim().toLowerCase();
    const items = keyword
      ? tenants.filter(t => (t.name || '').toLowerCase().includes(keyword))
      : tenants;

    document.getElementById('tenant-sub').textContent = tenants.length
      ? `${tenants.length} 个租户 · 点租户名看用量画像`
      : '还没有租户';

    if (!tenants.length) {
      box.replaceChildren(emptyState('还没有租户',
        '注册流程会创建第一个租户。',
        el('a', { class: 'btn', href: '/login', text: '去注册页' })));
      return;
    }
    if (!items.length) {
      box.replaceChildren(emptyState('没有匹配的租户', '换个关键词试试。'));
      return;
    }

    const tbody = el('tbody');
    for (const tenant of items) {
      const ratio = pct(tenant.quota_used || 0, tenant.quota_total || 0);
      const level = ratio >= 100 ? 'bad' : (ratio >= 80 ? 'warn' : '');

      tbody.append(el('tr', {},
        el('td', {},
          el('div', { class: 'tenant-name' },
            el('b', {}, el('a', { href: '/platform/tenants/' + tenant.id,
              text: tenant.name })),
            el('span', { class: 'muted-mono', text: tenant.slug || '' }))),
        el('td', {}, el('span', { class: 'tag' + (tenant.plan ? ' brand' : ''),
          text: planNames[tenant.plan] || tenant.plan || '未订阅' })),
        el('td', { class: 'nowrap' },
          el('span', { class: 'mini-bar ' + level },
            el('i', { style: `width:${Math.min(100, ratio)}%` })),
          el('span', { class: 'muted', style: 'margin-left:8px',
            text: `${fmtNum(tenant.quota_used)} / ${fmtNum(tenant.quota_total)}` })),
        el('td', { class: 'num' }, fmtNum(tenant.member_count)),
        el('td', { class: 'num' }, fmtNum(tenant.kb_count)),
        el('td', {},
          el('a', { class: 'btn sm', href: '/platform/tenants/' + tenant.id,
            text: '查看' }))));
    }

    box.replaceChildren(el('div', { class: 'table-wrap' },
      el('table', { class: 'table' },
        el('thead', {}, el('tr', {},
          el('th', { text: '租户' }),
          el('th', { text: '套餐' }),
          el('th', { text: '额度' }),
          el('th', { text: '账号', class: 'num' }),
          el('th', { text: '知识库', class: 'num' }),
          el('th', { text: '操作' }))),
        tbody)));
  }

  async function load() {
    const [r, plansRes] = await Promise.all([
      API.get('/api/platform/tenants'),
      API.get('/api/platform/plans'),
    ]);
    if (!r.ok) {
      showMsg(msg, 'bad', r.data.error || '租户加载失败');
      box.replaceChildren();
      return;
    }
    if (plansRes.ok) {
      planNames = Object.fromEntries((plansRes.data || []).map(p => [p.plan, p.name]));
    }
    tenants = r.data || [];
    renderKpis();
    renderTable();
  }

  filter.addEventListener('input', renderTable);
  load();
})();
</script>
{% endblock %}
