{% extends "base.html" %}
{% block title %}平台后台 · 企业知识库{% endblock %}

{% block body %}
<div id="msg"></div>

<div class="card">
  <h2>用量排行</h2>
  <div id="ranking"><p class="empty">加载中…</p></div>
</div>

<div class="card">
  <h2>全部租户</h2>
  <div id="tenants"><p class="empty">加载中…</p></div>
</div>

<div class="card">
  <h2>变更套餐</h2>
  <p class="muted" style="margin-top:0;">
    🔴 降级时如果已用量超过新额度，接口会返 <code>409</code> 并说明原因 ——
    不会自动截断已用量（那等于凭空抹掉客户已消耗的额度）。
  </p>
  <div class="row" style="gap:10px;flex-wrap:wrap;margin-top:12px;">
    <select id="plan-tenant" style="width:auto;min-width:180px;"></select>
    <select id="plan-target" style="width:auto;min-width:140px;"></select>
    <button class="primary" id="plan-apply">变更</button>
  </div>
  <div id="plan-result" style="margin-top:14px;"></div>
</div>
{% endblock %}

{% block script %}
<script>
  const msgBox = document.getElementById('msg');
  let tenants = [];
  let plans = [];

  function renderRanking(rows) {
    const box = document.getElementById('ranking');
    if (!rows.length) {
      box.replaceChildren(el('p', { class: 'empty', text: '还没有用量数据' }));
      return;
    }
    const max = Math.max(...rows.map(r => r.quota_used), 1);
    box.replaceChildren(el('table', {},
      el('thead', {}, el('tr', {},
        el('th', { text: '# ' }), el('th', { text: '租户' }),
        el('th', { text: '套餐' }), el('th', { text: '已用' }),
        el('th', { text: '占比' }),
      )),
      el('tbody', {}, ...rows.map(r => {
        const pct = Math.round(r.quota_used / max * 100);
        const bar = el('div', { class: 'bar', style: 'width:120px;' },
          el('i', { style: 'width:' + pct + '%;display:block;height:100%;'
                             + 'background:var(--brand);' }));
        return el('tr', {},
          el('td', { class: 'muted', text: r.rank }),
          el('td', { text: r.tenant_name }),
          el('td', {}, el('span', { class: 'role-tag', text: r.plan })),
          el('td', { text: r.quota_used + ' / ' + r.quota_total }),
          el('td', {}, bar),
        );
      })),
    ));
  }

  function renderTenants(rows) {
    const box = document.getElementById('tenants');
    if (!rows.length) {
      box.replaceChildren(el('p', { class: 'empty', text: '还没有租户' }));
      return;
    }
    box.replaceChildren(el('table', {},
      el('thead', {}, el('tr', {},
        el('th', { text: 'ID' }), el('th', { text: '名称' }),
        el('th', { text: '套餐' }), el('th', { text: '已用 / 总额' }),
        el('th', { text: '成员' }), el('th', { text: '知识库' }),
      )),
      el('tbody', {}, ...rows.map(t =>
        el('tr', {},
          el('td', { class: 'muted', text: t.id }),
          el('td', { text: t.name }),
          el('td', {}, el('span', { class: 'role-tag', text: t.plan || '—' })),
          el('td', { text: (t.quota_used || 0) + ' / ' + (t.quota_total || 0) }),
          el('td', { text: t.member_count }),
          el('td', { text: t.kb_count }),
        )
      )),
    ));

    // 填充下拉
    const sel = document.getElementById('plan-tenant');
    sel.replaceChildren(...rows.map(t =>
      el('option', { value: t.id, text: '#' + t.id + ' ' + t.name
                                            + '（' + (t.plan || '—') + '）' })));
  }

  (async () => {
    const me = await renderChrome('/platform');
    if (!me) { location.href = '/login'; return; }

    const [rank, list, planList] = await Promise.all([
      API.get('/api/platform/usage-ranking'),
      API.get('/api/platform/tenants'),
      API.get('/api/platform/plans'),
    ]);

    if (rank.ok) renderRanking(rank.data);
    else showMsg(msgBox, 'err', (rank.data && rank.data.error) || '加载排行失败');

    if (list.ok) { tenants = list.data; renderTenants(list.data); }
    else showMsg(msgBox, 'err', (list.data && list.data.error) || '加载租户失败');

    if (planList.ok) {
      plans = planList.data;
      document.getElementById('plan-target').replaceChildren(
        ...plans.map(p => el('option', { value: p.plan,
          text: p.name + '（' + p.quota_total + ' 次/月）' })));
    }
  })();

  document.getElementById('plan-apply').addEventListener('click', async () => {
    const tenantId = document.getElementById('plan-tenant').value;
    const plan = document.getElementById('plan-target').value;
    if (!tenantId || !plan) return;

    const btn = document.getElementById('plan-apply');
    btn.disabled = true;
    const resultBox = document.getElementById('plan-result');
    resultBox.replaceChildren();
    try {
      const r = await API.put('/api/platform/tenants/' + tenantId + '/plan', { plan });

      if (r.ok) {
        resultBox.replaceChildren(el('div', { class: 'msg ok',
          text: '已变更：套餐 ' + r.data.plan + '，总额度 ' + r.data.quota_total
                + '，已用 ' + r.data.quota_used }));
        // 刷新列表
        const list = await API.get('/api/platform/tenants');
        if (list.ok) { tenants = list.data; renderTenants(list.data); }
        const rank = await API.get('/api/platform/usage-ranking');
        if (rank.ok) renderRanking(rank.data);
      } else {
        // 🔴 409 降级冲突要把后端那句话原样显示出来 ——
        //    那才是让人理解「为什么不让降级」的关键
        resultBox.replaceChildren(el('div', {
          class: 'msg ' + (r.status === 409 ? 'warn' : 'err'),
          text: (r.data && r.data.error) || ('变更失败（HTTP ' + r.status + '）'),
        }));
      }
    } finally {
      btn.disabled = false;
    }
  });
</script>
{% endblock %}
